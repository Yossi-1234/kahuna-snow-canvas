<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Kahuna Holiday Lights — Plymouth</title>
<meta name="theme-color" content="#1f7a4d">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
<style>
  :root{--green:#2e9e5b;--amber:#e0a12b;--gray:#98a2ae;--red:#d6483f;--ink:#1a2430;--muted:#6b7785;--line:#e2e6ea;--brand:#1f7a4d;}
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:#f6f8fa;}
  #gate{height:100%;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--muted);}
  #gate a{color:var(--brand);font-weight:600;}
  #app{display:none;height:100%;flex-direction:column;}
  header{display:flex;align-items:center;gap:10px;padding:9px 14px;background:#fff;border-bottom:1px solid var(--line);z-index:1000;flex-wrap:wrap;}
  header .brand{font-weight:800;font-size:15px;white-space:nowrap;}
  header .brand span{color:var(--brand);}
  header .spacer{flex:1;}
  header a.btn-link,header button{background:none;border:1px solid var(--line);border-radius:7px;padding:6px 10px;font-size:12.5px;cursor:pointer;color:var(--ink);text-decoration:none;}
  header a.btn-link:hover,header button:hover{background:#f0f3f5;}
  #main{flex:1;position:relative;min-height:0;}
  #map{position:absolute;inset:0;}
  #stats-bar{position:absolute;top:10px;left:60px;z-index:800;background:rgba(255,255,255,.96);border-radius:10px;box-shadow:0 2px 10px rgba(20,30,40,.12);padding:8px 12px;font-size:12px;display:flex;gap:12px;flex-wrap:wrap;max-width:calc(100vw - 72px);}
  #stats-bar .stat b{display:block;font-size:15px;}
  #stats-bar .done b{color:var(--green);} #stats-bar .prog b{color:var(--amber);} #stats-bar .remain b{color:var(--gray);}
  #stats-bar .homes{border-left:1px solid #e3e8ec;padding-left:12px;}
  #search-box{position:absolute;top:10px;right:10px;z-index:800;width:230px;}
  #search-box input{width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--line);box-shadow:0 2px 10px rgba(20,30,40,.1);font-size:13.5px;}
  #search-results{background:#fff;border-radius:10px;margin-top:4px;box-shadow:0 2px 10px rgba(20,30,40,.12);max-height:260px;overflow:auto;display:none;}
  #search-results .res-item{padding:8px 12px;font-size:13px;border-bottom:1px solid var(--line);cursor:pointer;}
  #search-results .res-item:hover{background:#eef7f1;}
  #legend{position:absolute;bottom:14px;left:10px;z-index:800;background:rgba(255,255,255,.96);border-radius:10px;box-shadow:0 2px 10px rgba(20,30,40,.12);padding:8px 12px;font-size:11.5px;color:var(--muted);}
  #legend .row{display:flex;align-items:center;gap:6px;margin-top:3px;}
  #legend .dot{width:10px;height:10px;border-radius:50%;display:inline-block;}
  #locate-btn{position:absolute;right:10px;bottom:28px;z-index:900;width:42px;height:42px;display:flex;align-items:center;justify-content:center;background:#fff;border:none;border-radius:50%;box-shadow:0 2px 8px rgba(20,30,40,.28);cursor:pointer;color:#5f6b76;padding:0;}
  #locate-btn svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;}
  #locate-btn.following{color:#1a73e8;}
  .user-dot{position:relative;}
  .user-dot .core{position:absolute;top:0;left:0;width:16px;height:16px;border-radius:50%;background:#1a73e8;border:2px solid #fff;box-shadow:0 0 4px rgba(0,0,0,.4);}
  .user-dot .pulse{position:absolute;top:0;left:0;width:16px;height:16px;border-radius:50%;background:rgba(26,115,232,.35);animation:up 2s ease-out infinite;}
  @keyframes up{0%{transform:scale(1);opacity:.7}100%{transform:scale(3.2);opacity:0}}
  .kc{background:transparent!important;border:none!important;}
  #panel{position:absolute;right:0;top:0;bottom:0;width:340px;max-width:92vw;background:#fff;box-shadow:-2px 0 14px rgba(20,30,40,.1);transform:translateX(100%);transition:transform .18s ease;z-index:1100;display:flex;flex-direction:column;}
  #panel.open{transform:translateX(0);}
  #panel .p-head{padding:16px 18px 10px;border-bottom:1px solid var(--line);}
  #panel .close{float:right;background:none;border:none;font-size:20px;color:var(--muted);cursor:pointer;line-height:1;}
  #panel h2{font-size:16.5px;margin:0 6px 4px 0;}
  #panel .meta{font-size:12.5px;color:var(--muted);}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;margin-top:8px;}
  .badge.not_started{background:#eef1f3;color:var(--gray);} .badge.in_progress{background:#fdf1dc;color:#93650f;}
  .badge.completed{background:#e2f5e9;color:var(--green);} .badge.skipped{background:#fbeaea;color:var(--red);}
  #panel .p-body{flex:1;overflow:auto;padding:14px 18px;}
  .nav-btn{width:100%;background:#1a73e8;color:#fff;border:none;border-radius:8px;padding:11px;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:14px;}
  .actions{display:flex;gap:8px;margin-bottom:16px;}
  .actions button{flex:1;padding:9px 4px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:700;cursor:pointer;}
  .a-prog{color:#93650f;border-color:#f1cf94!important;} .a-done{color:var(--green);border-color:#a9dcbe!important;} .a-skip{color:var(--red);border-color:#eab5b0!important;} .a-clear{color:var(--muted);}
  .sec{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:14px 0 6px;}
  textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:13px;font-family:inherit;resize:vertical;min-height:52px;}
  .save-note{margin-top:6px;background:var(--brand);color:#fff;border:none;border-radius:8px;padding:8px 12px;font-size:12.5px;font-weight:600;cursor:pointer;}
  ul.addr{list-style:none;margin:0;padding:0;font-size:13.5px;}
  ul.addr li{padding:6px 0;border-bottom:1px solid #f0f2f4;display:flex;justify-content:space-between;}
  ul.addr .yr{color:var(--muted);font-size:12px;}
  @media (max-width:640px){
    #search-box{top:10px;left:56px;right:10px;width:auto;}
    #stats-bar{top:56px;left:56px;right:10px;max-width:none;font-size:11px;padding:6px 10px;gap:10px;flex-wrap:nowrap;overflow-x:auto;}
    #panel{width:100%;max-width:100%;}
  }

  #locate-btn{right:14px!important;bottom:calc(110px + env(safe-area-inset-bottom))!important;width:58px!important;height:58px!important;z-index:1000!important;background:#1a73e8!important;color:#fff!important;box-shadow:0 3px 12px rgba(0,0,0,.5)!important;border:3px solid #fff!important;}
  #locate-btn svg{width:30px;height:30px;}
  #locate-btn.following{background:#0b3d91!important;}
  #locate-btn::after{content:'My location';position:absolute;right:66px;top:50%;transform:translateY(-50%);background:rgba(20,30,40,.88);color:#fff;font-size:12px;font-weight:700;padding:4px 8px;border-radius:6px;white-space:nowrap;pointer-events:none;}

  .office-marker-wrap{background:transparent!important;border:none!important;}
  .office-marker{width:48px;height:48px;border-radius:50% 50% 50% 0;background:#7b3fa0;border:3px solid #fff;transform:rotate(-45deg);box-shadow:0 3px 10px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;}
  .office-marker span{transform:rotate(45deg);font-size:24px;line-height:1;}
</style>
</head>
<body>
<div id="gate">Loading…</div>
<div id="app">
  <header>
    <div class="brand">🎄 Kahuna <span>Holiday Lights — Plymouth</span></div>
    <div class="spacer"></div>
    <button id="view-btn">💰 Value view</button>
    <a class="btn-link" href="index.html">← Snow Canvass</a>
  </header>
  <div id="main">
    <div id="map"></div>
    <button id="locate-btn" title="Show my location" aria-label="Show my location">
      <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="12" r="4"></circle><line x1="12" y1="1" x2="12" y2="5"></line><line x1="12" y1="19" x2="12" y2="23"></line><line x1="1" y1="12" x2="5" y2="12"></line><line x1="19" y1="12" x2="23" y2="12"></line></svg>
    </button>
    <div id="stats-bar">
      <div class="stat done"><b id="s-done">0</b>Done</div>
      <div class="stat prog"><b id="s-prog">0</b>In progress</div>
      <div class="stat remain"><b id="s-remain">0</b>Not hit yet</div>
      <div class="stat homes"><b id="s-homes">0</b>Homes done</div>
    </div>
    <div id="search-box"><input type="text" id="search-input" placeholder="Search street or address…"><div id="search-results"></div></div>
    <div id="legend">
      <div style="font-weight:700;color:var(--ink);">Door hangers</div>
      <div class="row"><span class="dot" style="background:#98a2ae"></span> Not hit yet</div>
      <div class="row"><span class="dot" style="background:#e0a12b"></span> In progress</div>
      <div class="row"><span class="dot" style="background:#2e9e5b"></span> Done</div>
      <div class="row"><span class="dot" style="background:#d6483f"></span> Skipped</div>
    </div>
    <div id="panel">
      <div class="p-head">
        <button class="close" id="close-panel">&times;</button>
        <h2 id="p-name">—</h2><div class="meta" id="p-meta">—</div><span class="badge" id="p-badge">—</span>
      </div>
      <div class="p-body">
        <button class="nav-btn" id="nav-btn">🧭 Navigate this block in Google Maps</button>
        <div class="actions">
          <button class="a-prog" id="act-prog">Start</button>
          <button class="a-done" id="act-done">Mark done</button>
          <button class="a-skip" id="act-skip">Skip</button>
          <button class="a-clear" id="act-clear">Clear</button>
        </div>
        <div class="sec">Notes</div>
        <textarea id="p-notes" placeholder="e.g. skipped 2 homes, no-solicitation signs"></textarea>
        <button class="save-note" id="save-note">Save note</button>
        <div class="sec">Last update</div>
        <div class="meta" id="p-hist">Nothing yet.</div>
        <div class="sec" id="addr-title">Homes</div>
        <ul class="addr" id="p-addrs"></ul>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = 'https://rcavqtzrezczmzpwwudj.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJjYXZxdHpyZXpjem16cHd3dWRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5ODc3NTMsImV4cCI6MjEwMjU2Mzc1M30.JB2vpHcZzv74J2jbJr-3pEX0ixk9MTAq0KPhF44l0gk';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const COLOR = { not_started:'#98a2ae', in_progress:'#e0a12b', completed:'#2e9e5b', skipped:'#d6483f' };
const LABEL = { not_started:'Not hit yet', in_progress:'In progress', completed:'Done', skipped:'Skipped' };
const S = { terr:[], status:{}, markers:{}, sel:null, parcels:[], userId:null };
let map, cluster;

const gate = document.getElementById('gate');
function deny(msg){ gate.innerHTML = msg + '<br><br><a href="index.html">Back to Snow Canvass</a>'; }

(async function init(){
  const { data:{ session } } = await sb.auth.getSession();
  if (!session) { deny('Please log in on the main page first.'); return; }
  S.userId = session.user.id;
  const { data: prof } = await sb.from('profiles').select('role').eq('id', S.userId).single();
  let ok = !!prof && prof.role === 'admin'; if (!ok) { const { data: acc } = await sb.from('holiday_access').select('user_id').eq('user_id', S.userId).maybeSingle(); ok = !!acc; } if (!ok) { deny('This page is for admins only.'); return; }
  gate.style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  initMap();
  await loadData();
  render();
  wire();
})();

async function fetchAll(make, size=1000){
  let from=0; const all=[];
  for(;;){ const {data,error}=await make().range(from,from+size-1); if(error){console.error(error);return null;} all.push(...(data||[])); if(!data||data.length<size)break; from+=size; }
  return all;
}
async function loadData(){
  const t = await fetchAll(()=>sb.from('territories').select('*').eq('city','Plymouth').or('hidden.eq.false,holiday_only.eq.true').order('street_name').order('block_low').order('id'));
  S.terr = t || [];
  const st = await fetchAll(()=>sb.from('holiday_status').select('*').order('territory_id'));
  S.status = {}; for (const r of (st||[])) S.status[r.territory_id] = r;
}
const stOf = id => S.status[id]?.status || 'not_started';
S.view = 'status';
function valueColor(score){
  if(score==null) return '#c9d1d9';
  const s=Math.max(0,Math.min(100,Number(score)))/100, L=(a,b,k)=>Math.round(a+(b-a)*k);
  const lo=[120,135,150], mid=[245,190,60], hi=[214,40,57];
  const [a,b,k]= s<0.5?[lo,mid,s/0.5]:[mid,hi,(s-0.5)/0.5];
  return `rgb(${L(a[0],b[0],k)},${L(a[1],b[1],k)},${L(a[2],b[2],k)})`;
}
function renderLegend(){
  const lg=document.getElementById('legend');
  lg.innerHTML = S.view==='value'
    ? `<div style="font-weight:700;color:var(--ink);">Home value + closeness</div>
       <div class="row"><span class="dot" style="background:${valueColor(95)};box-shadow:0 0 0 2px #fff3b0"></span> Highest home values</div>
       <div class="row"><span class="dot" style="background:${valueColor(50)}"></span> Mid</div>
       <div class="row"><span class="dot" style="background:${valueColor(8)}"></span> Lower home values</div>
       <div class="row"><span class="dot" style="background:${valueColor(null)}"></span> No value data</div>
       <div class="row" style="margin-top:6px;">Bigger dot = high value + homes close together</div>
       <div class="row"><span class="dot" style="background:#fff;border:3px solid #0b6b2e;box-sizing:border-box"></span> Green ring = hung</div>`
    : `<div style="font-weight:700;color:var(--ink);">Door hangers</div>
       <div class="row"><span class="dot" style="background:#98a2ae"></span> Not hit yet</div>
       <div class="row"><span class="dot" style="background:#e0a12b"></span> In progress</div>
       <div class="row"><span class="dot" style="background:#2e9e5b"></span> Done</div>
       <div class="row"><span class="dot" style="background:#d6483f"></span> Skipped</div>`;
}

function initMap(){
  map = L.map('map',{zoomControl:true}).setView([45.0105,-93.4555],12);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Imagery &copy; Esri, Maxar'}).addTo(map);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,pane:'overlayPane'}).addTo(map);
  L.marker([44.9861367,-93.397256],{icon:L.divIcon({className:'office-marker-wrap',html:'<div class="office-marker"><span>🏢</span></div>',iconSize:[48,48],iconAnchor:[24,48]}),zIndexOffset:950,keyboard:false}).addTo(map).bindTooltip('Kahuna Office — 634 Mendelssohn Ave N',{direction:'top',offset:[0,-40]});
  cluster = L.markerClusterGroup({maxClusterRadius:40,disableClusteringAtZoom:17,iconCreateFunction:clusterIcon});
  map.addLayer(cluster);
  initLocate();
}
function clusterIcon(c){
  const ch=c.getAllChildMarkers(), n=ch.length; let done=0, act=0, best=null;
  for(const m of ch){ const s=m.options.statusKey; if(s==='completed')done++; else if(s==='in_progress'||s==='skipped')act++; const v=m.options.valueScore; if(typeof v==='number'&&(best===null||v>best))best=v; }
  const color = (n>0&&done===n)?COLOR.completed:S.view==='value'?valueColor(best):(n>0&&done===n)?COLOR.completed:(done>0||act>0)?COLOR.in_progress:COLOR.not_started;
  const size = n<10?32:n<30?38:46;
  return L.divIcon({html:`<div style="background:${color};width:${size}px;height:${size}px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);">${n}</div>`,className:'kc',iconSize:L.point(size,size),iconAnchor:L.point(size/2,size/2)});
}

function render(){
  cluster.clearLayers(); S.markers={};
  let done=0,prog=0,homesDone=0,total=0;
  for(const t of S.terr){
    total += t.home_count||0;
    const s = stOf(t.id);
    if(s==='completed'){done++;homesDone+=t.home_count||0;} else if(s==='in_progress')prog++;
    if(t.centroid_lat==null)continue;
    const vs = t.value_score==null?null:Number(t.value_score), vp = t.value_pct==null?null:Number(t.value_pct), isV=S.view==='value', top=isV&&vs>=75;
    const w=(s==='completed'||s==='in_progress'); const ringC = isV ? (s==='completed'?'#0b6b2e':s==='in_progress'?'#b8780a':(top?'#fff3b0':'#fff')) : '#fff';
    const ringW = isV ? (s==='completed'?4:s==='in_progress'?3:(top?3.5:1.5)) : 1.5;
    const m = L.circleMarker([t.centroid_lat,t.centroid_lng],{radius:isV?(w?Math.max(10,4+((vs||0)/100)*16):4+((vs||0)/100)*16):6+Math.min(t.home_count,15)*0.7,color:(isV&&w)?'#fff':ringC,weight:(isV&&w)?3:ringW,fillColor:isV?(w?COLOR[s]:valueColor(vp)):COLOR[s],fillOpacity:isV&&vp==null&&!w?.45:.95,statusKey:s,valueScore:vp});
    m.on('click',()=>openPanel(t.id));
    m.bindTooltip(`${t.name} · ${t.home_count} homes`,{direction:'top',offset:[0,-6]});
    cluster.addLayer(m); S.markers[t.id]=m;
  }
  document.getElementById('s-done').textContent=done;
  document.getElementById('s-prog').textContent=prog;
  document.getElementById('s-remain').textContent=S.terr.length-done-prog;
  document.getElementById('s-homes').textContent=`${homesDone.toLocaleString()} / ${total.toLocaleString()}`;
}

async function openPanel(id){
  S.sel=id; const t=S.terr.find(x=>x.id===id); if(!t)return;
  const s=stOf(id), row=S.status[id];
  document.getElementById('p-name').textContent=t.name;
  document.getElementById('p-meta').textContent=`${t.home_count} homes · avg built ${t.avg_year_built??'—'}${t.avg_emv?' · avg value $'+Math.round(t.avg_emv/1000).toLocaleString()+'k · ~'+Math.round(t.spacing_m)+' m between homes':''}`;
  const b=document.getElementById('p-badge'); b.textContent=LABEL[s]; b.className='badge '+s;
  document.getElementById('p-notes').value=row?.notes||'';
  document.getElementById('p-hist').textContent=row?`${LABEL[s]} · ${new Date(row.updated_at).toLocaleString()}`:'Nothing yet.';
  document.getElementById('addr-title').textContent=`Homes in this block (${t.home_count})`;
  const ul=document.getElementById('p-addrs'); ul.innerHTML='<li>Loading…</li>';
  document.getElementById('panel').classList.add('open');
  const {data}=await sb.from('parcels').select('address,year_built,lat,lng').eq('territory_id',id).order('address');
  S.parcels=data||[];
  ul.innerHTML=S.parcels.map(p=>`<li><span>${p.address}</span><span class="yr">${p.year_built??''}</span></li>`).join('');
}

async function setStatus(status){
  const id=S.sel; if(!id)return;
  const existing=S.status[id];
  const payload={territory_id:id,status,updated_by:S.userId,updated_at:new Date().toISOString(),notes:existing?.notes??null};
  const {error}=await sb.from('holiday_status').upsert(payload,{onConflict:'territory_id'});
  if(error){alert('Could not update: '+error.message);return;}
  S.status[id]={...(existing||{}),...payload}; render(); openPanel(id);
}
async function clearStatus(){
  const id=S.sel; if(!id)return;
  if(!confirm('Clear this block back to "Not hit yet"?'))return;
  const {error}=await sb.from('holiday_status').delete().eq('territory_id',id);
  if(error){alert('Could not clear: '+error.message);return;}
  delete S.status[id]; render(); openPanel(id);
}
async function saveNote(){
  const id=S.sel; if(!id)return;
  const existing=S.status[id];
  const payload={territory_id:id,status:existing?.status||'in_progress',notes:document.getElementById('p-notes').value,updated_by:S.userId,updated_at:new Date().toISOString()};
  const {error}=await sb.from('holiday_status').upsert(payload,{onConflict:'territory_id'});
  if(error){alert('Could not save note: '+error.message);return;}
  S.status[id]={...(existing||{}),...payload}; render(); openPanel(id);
}

function wire(){
  document.getElementById('view-btn').onclick=()=>{
    S.view = S.view==='value'?'status':'value';
    document.getElementById('view-btn').textContent = S.view==='value'?'✅ Progress view':'💰 Value view';
    renderLegend(); render();
  };
  document.getElementById('close-panel').onclick=()=>document.getElementById('panel').classList.remove('open');
  document.getElementById('act-prog').onclick=()=>setStatus('in_progress');
  document.getElementById('act-done').onclick=()=>setStatus('completed');
  document.getElementById('act-skip').onclick=()=>setStatus('skipped');
  document.getElementById('act-clear').onclick=clearStatus;
  document.getElementById('save-note').onclick=saveNote;
  document.getElementById('nav-btn').onclick=()=>{
    const t=S.terr.find(x=>x.id===S.sel);
    const ps=(S.parcels||[]).filter(p=>p.lat!=null&&p.lng!=null).sort((a,b)=>(parseInt(a.address,10)||0)-(parseInt(b.address,10)||0));
    const ll=o=>o.lat+','+o.lng; let url;
    if(ps.length){ url='https://www.google.com/maps/dir/?api=1&destination='+ll(ps[ps.length-1])+'&travelmode=driving'; if(ps.length>1)url+='&waypoints='+ll(ps[0]); }
    else if(t&&t.centroid_lat!=null){ url='https://www.google.com/maps/dir/?api=1&destination='+t.centroid_lat+','+t.centroid_lng+'&travelmode=driving'; }
    else { alert('No location found for this block.'); return; }
    const a=document.createElement('a'); a.href=url; a.target='_blank'; a.rel='noopener'; document.body.appendChild(a); a.click(); a.remove();
  };
  const inp=document.getElementById('search-input'), res=document.getElementById('search-results'); let tm;
  inp.addEventListener('input',()=>{clearTimeout(tm);const q=inp.value.trim();if(q.length<2){res.style.display='none';return;}tm=setTimeout(()=>search(q),220);});
  async function search(q){
    const byStreet=S.terr.filter(t=>t.name.toLowerCase().includes(q.toLowerCase())).slice(0,6);
    const {data:am}=await sb.from('parcels').select('address,territory_id').ilike('address',`%${q}%`).limit(8);
    const ids=new Set(S.terr.map(t=>t.id));
    const items=[...byStreet.map(t=>({label:t.name,sub:`${t.home_count} homes`,id:t.id})),...(am||[]).filter(p=>ids.has(p.territory_id)).map(p=>({label:p.address,sub:'address',id:p.territory_id}))];
    res.innerHTML=items.map(r=>`<div class="res-item" data-id="${r.id}">${r.label}<br><span style="color:var(--muted);font-size:11px;">${r.sub}</span></div>`).join('')||'<div class="res-item">No matches in Plymouth</div>';
    res.style.display='block';
    res.querySelectorAll('.res-item[data-id]').forEach(el=>el.onclick=()=>{const t=S.terr.find(x=>x.id===el.dataset.id);if(t){map.setView([t.centroid_lat,t.centroid_lng],18);openPanel(t.id);}res.style.display='none';inp.value='';});
  }
  document.addEventListener('click',e=>{if(!e.target.closest('#search-box'))res.style.display='none';});
}

let watchId=null, locMarker=null, locCircle=null, following=false, first=true;
function initLocate(){
  const btn=document.getElementById('locate-btn');
  btn.onclick=()=>{
    if(!('geolocation' in navigator)){alert('Location not supported.');return;}
    if(watchId===null){
      following=true; first=true;
      watchId=navigator.geolocation.watchPosition(pos=>{
        const ll=[pos.coords.latitude,pos.coords.longitude];
        btn.classList.add('following');
        if(!locMarker){
          locMarker=L.marker(ll,{icon:L.divIcon({className:'user-dot',html:'<div class="pulse"></div><div class="core"></div>',iconSize:[16,16],iconAnchor:[8,8]}),interactive:false,zIndexOffset:1000}).addTo(map);
          locCircle=L.circle(ll,{radius:pos.coords.accuracy,color:'#1a73e8',weight:1,opacity:.3,fillOpacity:.12,interactive:false}).addTo(map);
        } else {locMarker.setLatLng(ll);locCircle.setLatLng(ll).setRadius(pos.coords.accuracy);}
        if(following){ if(first){map.setView(ll,Math.max(map.getZoom(),17));first=false;} else map.panTo(ll); }
      },err=>{ if(err&&err.code===1){alert('Location is blocked for this site. Enable it in your browser/phone settings.');navigator.geolocation.clearWatch(watchId);watchId=null;btn.classList.remove('following');} },
      {enableHighAccuracy:true,maximumAge:2000,timeout:15000});
    } else { following=true; btn.classList.add('following'); if(locMarker)map.setView(locMarker.getLatLng(),Math.max(map.getZoom(),17)); }
  };
  map.on('dragstart',()=>{if(following){following=false;btn.classList.remove('following');}});
}
</script>
